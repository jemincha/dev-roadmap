<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>누가 제일 허슬했나</title>

    <!-- SEO / 공유 메타 태그
         OG 태그는 SNS 크롤러가 JS를 실행하지 않고 이 정적 HTML만 읽으므로
         반드시 여기(빌드된 index.html)에 있어야 한다. JS로 나중에 넣는
         방식은 크롤러에게는 보이지 않는다. -->
    <meta name="description" content="아티스트들이 데뷔 이후 얼마나 꾸준히, 얼마나 밀도 있게 음악을 발매해왔는지 GitHub 잔디처럼 시각화하고 비교하는 서비스.">
    <meta property="og:title" content="누가 제일 허슬했나">
    <meta property="og:description" content="아티스트의 발매 활동을 GitHub 잔디처럼 시각화하고 Hustle Score로 비교해보세요.">
    <meta property="og:type" content="website">
    <!-- 배포 후 실제 도메인/이미지로 교체 필요 -->
    <meta property="og:url" content="https://example.com">
    <meta property="og:image" content="https://example.com/og-image.png">
    <meta name="twitter:card" content="summary_large_image">

    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">

    <!-- 에러 모니터링(Sentry)을 쓰려면:
         1) sentry.io에서 프로젝트를 만들고 DSN을 발급받는다
         2) 아래 스크립트 주석을 해제한다
         3) src/main.js의 SENTRY_DSN 상수에 발급받은 DSN을 채운다
         DSN이 비어있으면 main.js에서 아무 것도 하지 않으므로,
         지금 상태(주석 처리)로 둬도 안전하게 무시된다. -->
    <!-- <script src="https://browser.sentry-cdn.com/7.120.0/bundle.min.js" crossorigin="anonymous"></script> -->
</head>

<body>

    <header>
        <h1>누가 더 Hustle 했나</h1>
        <p>아티스트의 발매 활동을 GitHub 잔디처럼 비교해보세요.</p>
    </header>

    <main>

        <!-- 아티스트 검색 -->
        <section class="search-section">
            <form id="artist-search-form">
                <label for="artist-input">아티스트 검색</label>

                <div class="search-container">
                    <input
                        type="text"
                        id="artist-input"
                        placeholder="아티스트 이름을 입력하세요"
                        autocomplete="off"
                    >

                    <button type="submit" id="search-button">
                        검색
                    </button>

                    <div id="search-dropdown" class="search-dropdown"></div>
                </div>
            </form>
        </section>


        <!-- 대시보드 -->
        <section class="dashboard">

            <section id="artist-graphs" class="artist-graphs">
                <!-- JavaScript로 아티스트 그래프/온보딩 프리셋을 생성 -->
            </section>

            <aside id="detail-panel" class="detail-panel">

                <header class="detail-header">
                    <h2 id="detail-title">분기를 선택해주세요</h2>

                    <button
                        type="button"
                        id="close-detail-button"
                        aria-label="상세 정보 닫기"
                    >
                        ×
                    </button>
                </header>

                <div id="album-list" class="album-list">
                    <p class="detail-placeholder">
                        그래프의 분기를 클릭하면
                        해당 기간에 발매된 앨범을 확인할 수 있습니다.
                    </p>
                </div>

            </aside>

        </section>
        <!-- Hustle Ranking 패널은 render.js가 여기(.dashboard) 바로 다음에
             동적으로 삽입한다 -->

    </main>

    <!-- ES 모듈 진입점. type="module"이라 브라우저가 src/*.js의
         import/export를 그대로 해석한다(별도 번들러 불필요). -->
    <script type="module" src="src/main.js"></script>

</body>
</html>
